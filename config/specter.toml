[system]
site_name = "LAB-01"
log_level = "info"

[rf]
device = "soapy"
sample_rate = 2400000
center_frequency_hz = 433000000
bandwidth_hz = 2000000
gain = 30.0
fft_size = 4096
window_function = "hann"
overlap = 0.5
dwell_time_ms = 100

[policy]
automatic_channel_change = true
minimum_confidence = 0.85
cooldown_seconds = 120
max_changes_per_hour = 4
rollback_timeout_secs = 30
minimum_improvement_db = 3.0

[security]
require_mtls = true
# tls_cert_path = "/etc/specter-net/certs/server.pem"
# tls_key_path = "/etc/specter-net/certs/server.key"
# ca_cert_path = "/etc/specter-net/certs/ca.pem"

[database]
url = "postgres://specter:specter@localhost/specter_net"
max_connections = 10

[server]
bind_address = "0.0.0.0"
port = 8080
